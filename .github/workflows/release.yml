name: Release Userscript

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Typecheck and unit tests
        run: npm run check

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build userscript
        run: npm run build

      - name: Verify version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          SCRIPT_VERSION=$(grep -oP '@version\s+\K[\d.]+' opencodego-dashboard.user.js)
          if [ "$SCRIPT_VERSION" != "$VERSION" ]; then
            echo "Error: Script version ($SCRIPT_VERSION) != tag version ($VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenCodeGo Dashboard Assistant v${{ steps.version.outputs.VERSION }}
          files: opencodego-dashboard.user.js
          body: |
            ## OpenCodeGo Dashboard Assistant v${{ steps.version.outputs.VERSION }}

            ### Installation
            [Install or update the userscript](https://raw.githubusercontent.com/HIUEETR/OpenCodeGo-Dashboard/main/opencodego-dashboard.user.js)

            ### Changes
            See the [commit history](https://github.com/HIUEETR/OpenCodeGo-Dashboard/commits/v${{ steps.version.outputs.VERSION }}).

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">OpenCodeGo Dashboard Assistant · GitHub README Banner</title>
  <desc id="desc">Dark animated SVG banner for the OpenCodeGo Dashboard Assistant userscript: request analytics, cache hit rate, TTFT, output TPS, usage forecasting and a local archive.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset=".55" stop-color="#0b0d11"/>
      <stop offset="1" stop-color="#11141a"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#b8c0cc"/>
      <stop offset="1" stop-color="#6f7885"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#7d8794" stop-opacity=".05"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#dfe5ec" stop-opacity=".20"/>
      <stop offset="1" stop-color="#dfe5ec" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="soft">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>

    <clipPath id="clip">
      <rect width="1280" height="360" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>

  <!-- ambient glow -->
  <ellipse cx="1080" cy="90" rx="280" ry="180" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="opacity" values=".35;.65;.35" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- moving scan line -->
  <g clip-path="url(#clip)" opacity=".16">
    <rect x="-400" y="0" width="180" height="360" fill="url(#line)" transform="skewX(-18)">
      <animate attributeName="x" from="-500" to="1450" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- decorative orbital lines -->
  <g fill="none" stroke="#d9dee5" stroke-opacity=".13">
    <path d="M820 36 C1030 -30 1190 12 1310 120"/>
    <path d="M760 92 C1010 5 1190 55 1340 175"/>
    <path d="M735 315 C980 225 1190 260 1330 350"/>
  </g>

  <!-- terminal / analytics motif -->
  <g transform="translate(790 68)">
    <rect width="405" height="224" rx="18" fill="#07090c" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="1" y="1" width="403" height="38" rx="17" fill="#ffffff" fill-opacity=".035"/>
    <circle cx="22" cy="20" r="4" fill="#fff" fill-opacity=".55"/>
    <circle cx="38" cy="20" r="4" fill="#fff" fill-opacity=".25"/>
    <circle cx="54" cy="20" r="4" fill="#fff" fill-opacity=".12"/>
    <text x="76" y="25" fill="#9ba4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">opencode / dashboard-assistant</text>

    <!-- mini code stream -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      <text x="24" y="68" fill="#737d89">$</text>
      <text x="38" y="68" fill="#cfd5dc">assistant</text>
      <text x="24" y="88" fill="#606a76">01</text>
      <text x="45" y="88" fill="#8d97a4">cache-hit</text>
      <text x="138" y="88" fill="#e4e8ed">97.59%</text>
      <text x="24" y="108" fill="#606a76">02</text>
      <text x="45" y="108" fill="#8d97a4">ttft</text>
      <text x="138" y="108" fill="#e4e8ed">2.28s</text>
      <text x="24" y="128" fill="#606a76">03</text>
      <text x="45" y="128" fill="#8d97a4">output tps</text>
      <text x="138" y="128" fill="#e4e8ed">319.7</text>
      <text x="24" y="148" fill="#606a76">04</text>
      <text x="45" y="148" fill="#8d97a4">local records</text>
      <text x="138" y="148" fill="#e4e8ed">12,017</text>
      <text x="24" y="168" fill="#606a76">05</text>
      <text x="45" y="168" fill="#8d97a4">usage forecast</text>
      <text x="138" y="168" fill="#e4e8ed">57.6%</text>
    </g>

    <!-- animated chart -->
    <g transform="translate(190 64)">
      <path d="M0 105H184" stroke="#fff" stroke-opacity=".08"/>
      <path d="M0 75H184" stroke="#fff" stroke-opacity=".06"/>
      <path d="M0 45H184" stroke="#fff" stroke-opacity=".06"/>
      <path d="M0 15H184" stroke="#fff" stroke-opacity=".06"/>

      <path d="M0 94 L25 82 L49 88 L72 54 L96 66 L119 36 L144 49 L165 18 L184 27"
            fill="none" stroke="#e7ebef" stroke-width="2.2" stroke-linecap="round">
        <animate attributeName="stroke-dasharray" values="0 600;600 0" dur="2.5s" repeatCount="indefinite"/>
      </path>

      <circle cx="184" cy="27" r="4" fill="#fff">
        <animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- left logo mark: abstract OpenCode-inspired terminal knot -->
  <g transform="translate(82 88)">
    <circle cx="82" cy="82" r="70" fill="#fff" fill-opacity=".025"/>
    <circle cx="82" cy="82" r="70" fill="none" stroke="#fff" stroke-opacity=".08"/>
    <path d="M48 67 L77 38 L106 67 L77 96 Z"
          fill="none" stroke="url(#accent)" stroke-width="9" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 77 67" to="360 77 67" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M58 91 L87 62 L116 91"
          fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="5" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values=".18;.55;.18" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title -->
  <g transform="translate(220 104)">
    <text x="0" y="0"
          fill="#ffffff"
          font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="34" font-weight="700" letter-spacing="-1.2">
      OpenCodeGo Dashboard Assistant
    </text>

    <text x="2" y="39"
          fill="#89929e"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'PingFang SC', 'Microsoft YaHei', monospace"
          font-size="15" letter-spacing=".2">
      REQUESTS · CACHE · TTFT · TPS · USAGE FORECAST
    </text>

    <!-- animated command cursor -->
    
  </g>

  <!-- bottom status rail -->
  <g transform="translate(82 306)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <circle cx="5" cy="-4" r="4" fill="#dfe4e9">
      <animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" fill="#7f8995">REQUESTS · CACHE HIT · TTFT · TPS · USAGE FORECAST · LOCAL ARCHIVE</text>
  </g>

  <!-- border -->
  <rect x=".75" y=".75" width="1278.5" height="358.5" rx="23.25"
        fill="none" stroke="#ffffff" stroke-opacity=".10"/>
</svg>
